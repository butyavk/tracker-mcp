# The plugin starts the published tracker-mcp with `uvx tracker-mcp==<version>`. The
# plugin directory reads this file and uv.lock to see every dependency with its exact
# version, source and hash. After each release reaches PyPI, the release workflow moves
# the pin, the lock and the plugin's version to it.
[project]
name = "tracker-mcp-plugin"
version = "0.6.0"
requires-python = ">=3.11"
dependencies = ["tracker-mcp==0.6.0"]

[tool.uv]
package = false

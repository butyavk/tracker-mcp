# Publishes the version in pyproject.toml, started by hand (Actions → release → Run
# workflow) or by pushing its tag (v0.3.0):
#   1. PyPI (trusted publishing: no token; the PyPI project trusts this workflow),
#   2. the official MCP Registry (GitHub OIDC: the io.github.butyavk namespace),
#   3. a GitHub release and its tag, with the Claude Desktop extension (.mcpb),
#   4. the Claude plugin: when PyPI serves the version, a commit on main moves the
#      plugin's pin, lock and version to it.
# The version must match server.json, mcpb/manifest.json and CHANGELOG.md.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: The version matches everywhere
        id: version
        run: |
          v="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -1)"
          if [ "$GITHUB_REF_TYPE" = tag ]; then test "$GITHUB_REF_NAME" = "v$v"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          test "$(jq -r .version server.json)" = "$v"
          test "$(jq -r '.packages[0].version' server.json)" = "$v"
          test "$(jq -r .version mcpb/manifest.json)" = "$v"
          awk -v v="$v" '$1 == "##" && $2 == v {found = 1} END {exit !found}' CHANGELOG.md
      - name: Tests
        run: |
          uv sync --frozen
          uv run --frozen pytest -q
      - name: The built-in Google client
        # Google requires a Desktop client's secret at sign-in even with PKCE, and does not
        # treat it as confidential for desktop apps. It stays out of git and goes only into
        # the packages: Settings → Secrets and variables → Actions → GOOGLE_OAUTH_CLIENT_SECRET.
        env:
          SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          if [ -z "$SECRET" ]; then
            echo "::error::Add the repository secret GOOGLE_OAUTH_CLIENT_SECRET (the tracker-mcp Desktop client's secret)"
            exit 1
          fi
          python3 - <<'EOF'
          import os
          secret = os.environ["SECRET"].strip()
          with open("src/tracker_mcp/_google_client.py", "w", encoding="utf-8") as f:
              f.write("# Written by the release build, not kept in git: the secret of tracker-mcp's\n"
                      "# Desktop-app Google client, which Google requires at sign-in.\n"
                      f"CLIENT_SECRET = {secret!r}\n")
          EOF
      - name: Package
        run: |
          uv build
          unzip -l dist/*.whl | grep -q tracker_mcp/_google_client.py
          tar tzf dist/*.tar.gz | grep -q tracker_mcp/_google_client.py
          uv run --isolated --no-project --with dist/*.whl python -c "from tracker_mcp import gsheets; assert gsheets.BUILTIN_CLIENT"
      - name: Claude Desktop extension
        run: |
          sh mcpb/build.sh dist-mcpb
          unzip -l dist-mcpb/*.mcpb | grep -q tracker_mcp/_google_client.py
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@v6
        with:
          name: mcpb
          path: dist-mcpb/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tracker-mcp
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  registry:
    needs: [build, pypi]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Wait until PyPI serves the new version
        run: |
          v="${{ needs.build.outputs.version }}"
          for i in $(seq 30); do
            curl -fsS "https://pypi.org/pypi/tracker-mcp/$v/json" >/dev/null && exit 0
            sleep 10
          done
          echo "PyPI does not serve tracker-mcp $v yet"; exit 1
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

  github-release:
    needs: [build, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          path: artifacts/
      - name: Release with the extension attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ needs.build.outputs.version }}"
          awk -v v="$v" '/^## /{p = ($2 == v); next} p' CHANGELOG.md > notes.md
          gh release create "v$v" --target "$GITHUB_SHA" --title "tracker-mcp $v" --notes-file notes.md \
            artifacts/mcpb/*.mcpb artifacts/dist/*

  plugin:
    # The plugin runs the published package, and plugin/uv.lock records its dependencies
    # for the plugin directory. So it can move to this version only after PyPI serves it.
    needs: [build, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: astral-sh/setup-uv@v7
      - name: Pin and lock the new version
        run: |
          v="${{ needs.build.outputs.version }}"
          sed -i "0,/\"version\": \"[^\"]*\"/s//\"version\": \"$v\"/; s/\"tracker-mcp==[^\"]*\"/\"tracker-mcp==$v\"/" plugin/.claude-plugin/plugin.json
          sed -i "s/^version = \".*\"/version = \"$v\"/; s/\"tracker-mcp==[^\"]*\"/\"tracker-mcp==$v\"/" plugin/pyproject.toml
          for i in $(seq 30); do   # the index can lag a little behind the JSON API
            (cd plugin && uv lock --refresh-package tracker-mcp) && break
            sleep 10
          done
      - name: Check the plugin
        run: |
          v="${{ needs.build.outputs.version }}"
          test "$(uvx "tracker-mcp==$v" --version | awk '{print $NF}')" = "$v"
          test "$(uv run --project plugin --frozen tracker-mcp --version | awk '{print $NF}')" = "$v"
          uv run --frozen pytest -q tests/test_packaging.py
      - name: Commit to main
        run: |
          v="${{ needs.build.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugin
          git diff --cached --quiet && exit 0
          git commit -m "plugin: tracker-mcp $v"
          git push origin HEAD:main
